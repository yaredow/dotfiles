# Configuration for autosub.lua
# Automatic subtitle downloader for MPV

subliminal_path=/home/yada/.local/bin/subliminal
language=en
language_alt=eng
language_name=English

# Automatically search & download on file load if no English subtitles exist
auto_download=yes

# Overwrite existing subtitle files when downloading
force=no

# Save subtitle files with UTF-8 encoding
utf8=yes

# Minimum video duration (in seconds) to trigger auto-download (120s = 2 min)
min_duration=120

# Notification display time on OSD (in seconds)
notify_duration=3
