# Configuration for autosubsync-mpv
# Synchronizes out-of-sync subtitles using ffsubsync

ffmpeg_path=/usr/bin/ffmpeg
ffsubsync_path=/home/yada/.local/bin/ffsubsync

# Preferred tool for syncing to audio: 'ffsubsync', 'alass', or 'ask'
audio_subsync_tool=ffsubsync

# Preferred tool for syncing to another subtitle track: 'ffsubsync', 'alass', or 'ask'
altsub_subsync_tool=ffsubsync

# Unload the old desynced subtitle track after retiming
unload_old_sub=yes

# Replace original subtitle file (no = save as *_retimed.srt)
overwrite_old_sub=no
