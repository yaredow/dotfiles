# Subtitle Search & Auto-Download (autosub.lua)
b script-binding autosub/download_subs          # Search & download English subtitles
B script-binding autosub/download_subs_force    # Force re-download English subtitles

# Subtitle Auto-Synchronization (autosubsync-mpv via ffsubsync)
n script-binding autosubsync/autosubsync-audio  # Auto-synchronize current subtitle to audio
Ctrl+n script-binding autosubsync/autosubsync-menu # Open subtitle sync options menu

# Subtitle Timing & Position Adjustments
z add sub-delay -0.1                            # Shift subtitles 100ms earlier
Z add sub-delay +0.1                            # Shift subtitles 100ms later
r add sub-pos -1                                # Move subtitles up
t add sub-pos +1                                # Move subtitles down
v cycle sub-visibility                          # Toggle subtitle visibility
