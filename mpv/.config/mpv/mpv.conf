# General Window & Playback Settings
osc=no
border=no
save-position-on-quit=yes

# Subtitle Autoloading & Preferences
sub-auto=fuzzy
sub-file-paths=sub:subs:subtitles:Subtitles:Sub:Subs
slang=en,eng,enUS,en-US
alang=en,eng,ja,jp,jpn

# Subtitle Appearance & Styling (Tokyo Night)
sub-font='sans-serif'
sub-font-size=36
sub-border-size=2.5
sub-shadow-offset=1
sub-pos=95
sub-color='#c0caf5'
sub-border-color='#1a1b26'
sub-scale=1.0

# OSD Appearance & Styling (Tokyo Night)
osd-font='sans-serif'
osd-font-size=26
osd-border-size=2.0
osd-scale=1
osd-color='#c0caf5'
osd-border-color='#1a1b26'

# Window Geometry
autofit=60%x60%
autofit-larger=70%x70%
autofit-smaller=35%x35%
geometry=50%:50%
