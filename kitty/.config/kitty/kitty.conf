# Tokyo Night theme
foreground #c0caf5
background #1a1b26
selection_foreground #c0caf5
selection_background #283457

# Cursor colors
cursor #c0caf5
cursor_text_color #1a1b26

# URL underline color when hovering with mouse
url_color #73daca

# Kitty window border colors
active_border_color #7aa2f7
inactive_border_color #292e42

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground #16161e
active_tab_background #7aa2f7
inactive_tab_foreground #545c7e
inactive_tab_background #292e42
tab_bar_background #15161e

# The 16 terminal colors

# black
color0 #15161e
color8 #414868

# red
color1 #f7768e
color9 #ff899d

# green
color2 #9ece6a
color10 #9fe044

# yellow
color3 #e0af68
color11 #faba4a

# blue
color4 #7aa2f7
color12 #8db0ff

# magenta
color5 #bb9af7
color13 #c7a9ff

# cyan
color6 #7dcfff
color14 #a4daff

# white
color7 #a9b1d6
color15 #c0caf5

hide_window_decorations yes

# Font
font_family FiraCode Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 10

# OpenType features: slashed zero for all FiraCode Nerd Font variants
font_features FiraCodeNF-Reg +zero
font_features FiraCodeNF-Ret +zero
font_features FiraCodeNF-Bold +zero
font_features FiraCodeNF-SemBd +zero

# Disable ligatures when cursor is on them for easier editing
disable_ligatures cursor

# Fine-tune font rendering (uncomment to adjust if text looks off)
# adjust_line_height 2px
# adjust_column_width 0
# adjust_baseline 0

# Tab bar styling
tab_bar_style powerline
tab_powerline_style slanted

# Window
window_padding_width 8
remember_window_size no
initial_window_width 800
initial_window_height 550

# Transparency
background_opacity 0.98

# Dim inactive windows
inactive_text_alpha 0.8

# Scrollback
scrollback_lines 10000

# Performance
sync_to_monitor yes

# Hide cursor on typing
mouse_hide_wait -3.0

# Strip trailing spaces on copy
strip_trailing_spaces smart

# Layouts
enabled_layouts Tall, Fat, Grid, *

# Keybindings
map ctrl+alt+h neighboring_window left
map ctrl+alt+j neighboring_window down
map ctrl+alt+k neighboring_window up
map ctrl+alt+l neighboring_window right

map ctrl+shift+enter launch --location=vsplit

map kitty_mod+plus change_font_size all +2.0
map kitty_mod+minus change_font_size all -2.0
map kitty_mod+0 change_font_size all 0
