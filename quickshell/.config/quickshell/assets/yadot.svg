<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="yadot logo">
  <title>yadot</title>
  <desc>Minimal terminal-style logo for the yadot dotfiles project</desc>

  <!-- badge -->
  <rect x="4" y="4" width="112" height="112" rx="24"
        fill="#0b0e14" stroke="#1c2230" stroke-width="1.5"/>

  <!-- corner signature dot -->
  <circle cx="99" cy="27" r="3" fill="#7aa2f7"/>

  <!-- wordmark -->
  <text x="59" y="70"
        text-anchor="middle"
        font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="26"
        font-weight="500"
        letter-spacing="-0.5">
    <tspan fill="#e8e9ec">ya</tspan><tspan fill="#7aa2f7">dot</tspan>
  </text>

  <!-- blinking terminal cursor -->
  <rect x="100" y="44" width="9" height="30" rx="1.5" fill="#7aa2f7">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1"
             dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- prompt underline -->
  <line x1="21" y1="86" x2="99" y2="86" stroke="#7aa2f7" stroke-width="2"
        stroke-linecap="round" opacity="0.55"/>
</svg>
