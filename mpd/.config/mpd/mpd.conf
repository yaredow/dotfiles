# Per-user MPD config — read automatically from ~/.config/mpd/mpd.conf
# After a fresh install: systemctl --user enable --now mpd.service

music_directory     "~/Music"
auto_update         "yes"
playlist_directory  "~/.config/mpd/playlists"
db_file             "~/.config/mpd/database"
log_file            "~/.config/mpd/log"
pid_file            "~/.config/mpd/pid"
state_file          "~/.config/mpd/state"
sticker_file        "~/.config/mpd/sticker.sql"

# Local socket only, not an IP — required for rmpc's YouTube/SoundCloud
# playback to work. Must match `address` in rmpc's config.ron.
bind_to_address     "/tmp/mpd_socket"

audio_output {
    type    "pulse"
    name    "Speakers"
}

# Feeds rmpc's Cava pane. Path must match `cava.input.source` in config.ron.
audio_output {
    type    "fifo"
    name    "Cava feed"
    path    "/tmp/mpd.fifo"
    format  "44100:16:2"
}
