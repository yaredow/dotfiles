mouse_support: true
invidious_instance: https://inv.zoomerville.com
write_config: false
allow_unicode: true
message_bar_default: All good :)
images: Sixel
refresh_after_modifying_search_filters: true
syncing:
  download_images: true
  sync_channel_info: true
  sync_channel_cooldown_secs: 86400
  sync_videos_cooldown_secs: 600
limits:
  watch_history: 50
  search_history: 75
  commands_history: 75
textbar_scroll_behaviour: History
image_index: 4
provider: Invidious
search_provider: Invidious
api_key: YOUR API KEY HERE
shell: sh
legacy_input_handling: false
env:
  save-path: ~/.local/share/youtube-tui/saved/
  terminal-emulator: kitty -e
  youtube-downloader: yt-dlp
  video-player: mpv
  browser: xdg-open
  download-path: ~/Downloads/%(title)s-%(id)s.%(ext)s
block_list:
  channels: []
